<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fundo branco com bordas arredondadas e sombra sutil -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Fundo principal -->
  <rect x="2" y="2" width="28" height="28" rx="6" ry="6" fill="white" filter="url(#shadow)"/>
  
  <!-- Elemento visual do Shogun - representação estilizada -->
  <g transform="translate(16, 16)">
    <!-- Círculo de fundo verde -->
    <circle cx="0" cy="0" r="8" fill="#10b981" opacity="0.1"/>
    
    <!-- Símbolo Shogun estilizado -->
    <path d="M -6,-2 L -2,-2 L -2,2 L -6,2 Z M 2,-2 L 6,-2 L 6,2 L 2,2 Z M -4,-6 L 4,-6 L 4,-4 L -4,-4 Z M -4,4 L 4,4 L 4,6 L -4,6 Z" 
          fill="#10b981" opacity="0.8"/>
    
    <!-- Centro -->
    <circle cx="0" cy="0" r="2" fill="#10b981"/>
  </g>
</svg>
