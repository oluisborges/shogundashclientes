<!DOCTYPE html>
<html>
<head>
    <title>Fix Admin Access</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Fix Admin Access</h1>
    <p>This page will help you fix your admin access to the users area.</p>
    
    <button onclick="checkCurrentRole()">Check My Current Role</button>
    <button onclick="fixMyAdmin()">Make Me Admin</button>
    
    <div id="result"></div>

    <script>
        async function checkCurrentRole() {
            try {
                const response = await fetch('/api/debug/fix-my-admin');
                const data = await response.json();
                
                let html = '<h3>Current Status:</h3>';
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (data.isAdmin) {
                    html += '<p class="success">✓ You already have admin access!</p>';
                } else {
                    html += '<p class="error">✗ You do not have admin access. Click "Make Me Admin" to fix this.</p>';
                }
                
                document.getElementById('result').innerHTML = html;
            } catch (error) {
                document.getElementById('result').innerHTML = '<p class="error">Error: ' + error.message + '</p>';
            }
        }
        
        async function fixMyAdmin() {
            try {
                const response = await fetch('/api/debug/fix-my-admin', { method: 'POST' });
                const data = await response.json();
                
                let html = '<h3>Result:</h3>';
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (data.success) {
                    html += '<p class="success">✓ Admin access fixed! Now refresh the users page.</p>';
                } else {
                    html += '<p class="error">✗ Error: ' + (data.error || 'Unknown error') + '</p>';
                }
                
                document.getElementById('result').innerHTML = html;
            } catch (error) {
                document.getElementById('result').innerHTML = '<p class="error">Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
